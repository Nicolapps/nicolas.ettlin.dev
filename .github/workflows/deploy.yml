on:
    push:
        branches:
            - main
    workflow_dispatch:

name: 🚀 Deploy website on push
jobs:
    web-deploy:
        name: 🎉 Deploy
        runs-on: ubuntu-latest
        steps:
            - name: 🚚 Get latest code
              uses: actions/checkout@v5

            - name: 📂 Sync files
              uses: SamKirkland/FTP-Deploy-Action@v4.3.6
              with:
                  server: ${{ secrets.host }}
                  username: ${{ secrets.username }}
                  password: ${{ secrets.ftp_password }}
                  security: strict
                  server-dir: ./
